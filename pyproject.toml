[project]
name = "music-bot"
version = "2.0.0"
description = "A Discord music bot with interactive UI controls, YouTube and SoundCloud support, and smart autoplay."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "discord.py[voice]>=2.7.1,<3.0.0",
    "python-dotenv>=1.2.2,<2.0.0",
    "yt-dlp>=2026.6.9",
]

[tool.uv]
# This is an application, not a distributable package, so uv should not
# try to build or install the project itself.
package = false
